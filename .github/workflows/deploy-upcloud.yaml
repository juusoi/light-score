name: Deploy to UpCloud

on:
  # Manual trigger OR automatic after security checks succeed on main
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment regardless of changed files'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ['Security checks']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: upcloud-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Change Detection
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Check if deployable files changed
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.changes.outputs.should_deploy || steps.manual.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect deployable changes
        id: changes
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { owner, repo } = context.repo;

            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: sha
            });

            const changedFiles = commit.files?.map(f => f.filename) || [];
            core.info(`Changed files in ${sha}:`);
            changedFiles.forEach(f => core.info(`  - ${f}`));

            const deployPatterns = [
              /^backend\//,
              /^frontend\//,
              /^functions\//,
              /^deploy\//,
              /^compose\.yaml$/,
              /^compose\.prod\.yaml$/,
              /^pyproject\.toml$/,
              /^uv\.lock$/,
              /^\.github\/workflows\/deploy-upcloud\.yaml$/,
            ];

            const shouldDeploy = changedFiles.some(file =>
              deployPatterns.some(pattern => pattern.test(file))
            );

            core.info(`\nShould deploy: ${shouldDeploy}`);
            core.setOutput('should_deploy', String(shouldDeploy));

            if (!shouldDeploy) {
              core.info('ℹ️ No deployable changes detected. Skipping UpCloud deployment.');
            }

      - name: Force deploy on manual trigger
        id: manual
        if: github.event_name != 'workflow_run'
        run: echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Prerequisites Check
  # ─────────────────────────────────────────────────────────────────────────────
  check-prerequisites:
    name: Verify CI and Security passed
    runs-on: ubuntu-latest
    needs: [detect-changes]
    outputs:
      deploy-ready: ${{ steps.check.outputs.ready || steps.manual_ready.outputs.ready }}
    steps:
      - name: Check workflow prerequisites
        id: check
        if: |
          github.event_name == 'workflow_run' && 
          github.event.workflow_run.conclusion == 'success' &&
          needs.detect-changes.outputs.should-deploy == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: sha, status: 'completed', per_page: 50
            });

            const findByName = (name) => data.workflow_runs.find(r => r.name === name);
            const ci = findByName('CI');
            const security = findByName('Security checks');

            const ciPassed = ci?.conclusion === 'success';
            const securityPassed = security?.conclusion === 'success';

            core.info(`CI passed: ${ciPassed}`);
            core.info(`Security passed: ${securityPassed}`);

            const ready = ciPassed && securityPassed;
            core.setOutput('ready', String(ready));

            if (!ready) {
              core.setFailed('Prerequisites not met: Both CI and Security workflows must pass');
            }

      - name: Mark ready for manual trigger
        id: manual_ready
        if: github.event_name != 'workflow_run'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and Push Container Images to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [detect-changes, check-prerequisites]
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
       needs.detect-changes.outputs.should-deploy == 'true' &&
       needs.check-prerequisites.outputs.deploy-ready == 'true')
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Cache Docker layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Generate image tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA:0:7}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          # Convert repository owner to lowercase for Docker image tags
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${{ env.REGISTRY }}/${OWNER_LC}/light-score-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${OWNER_LC}/light-score-frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker buildx build \
            -f backend/Dockerfile \
            -t "${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.backend_image }}:latest" \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --push .

      - name: Build and push frontend image
        run: |
          set -euo pipefail
          docker buildx build \
            -f frontend/Dockerfile \
            -t "${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.frontend_image }}:latest" \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --push .

          # Rotate cache
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to UpCloud via SSH
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to UpCloud (Podman)
    runs-on: ubuntu-latest
    needs: [detect-changes, check-prerequisites, build-push]
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
       needs.detect-changes.outputs.should-deploy == 'true' &&
       needs.check-prerequisites.outputs.deploy-ready == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check UpCloud secrets configured
        id: check-secrets
        env:
          UPCLOUD_HOST: ${{ secrets.UPCLOUD_HOST }}
          UPCLOUD_SSH_KEY: ${{ secrets.UPCLOUD_SSH_KEY }}
        run: |
          if [[ -z "${UPCLOUD_HOST:-}" || -z "${UPCLOUD_SSH_KEY:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ UPCLOUD_HOST or UPCLOUD_SSH_KEY secret not set. Skipping remote SSH deploy step."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH to UpCloud
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          UPCLOUD_HOST: ${{ secrets.UPCLOUD_HOST }}
          UPCLOUD_USER: ${{ secrets.UPCLOUD_USER || 'deployer' }}
          UPCLOUD_SSH_KEY: ${{ secrets.UPCLOUD_SSH_KEY }}
          SHA_TAG: ${{ needs.build-push.outputs.sha_tag }}
        run: |
          set -euo pipefail

          # Setup SSH Agent
          eval "$(ssh-agent -s)"
          echo "$UPCLOUD_SSH_KEY" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$UPCLOUD_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Ensure remote target directory exists
          ssh "${UPCLOUD_USER}@${UPCLOUD_HOST}" "mkdir -p ~/light-score"

          # Copy compose.prod.yaml and deploy script to remote host
          scp compose.prod.yaml "${UPCLOUD_USER}@${UPCLOUD_HOST}:~/light-score/compose.prod.yaml"
          scp scripts/deploy-upcloud.sh "${UPCLOUD_USER}@${UPCLOUD_HOST}:~/light-score/deploy.sh"

          # Deploy with rootless Podman (SHA_TAG is intentionally client-side expanded)
          # shellcheck disable=SC2029
          ssh "${UPCLOUD_USER}@${UPCLOUD_HOST}" "IMAGE_TAG='${SHA_TAG}' bash ~/light-score/deploy.sh"

