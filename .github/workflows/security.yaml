name: Security checks

on:
  # Run directly on PRs targeting main for fast feedback
  pull_request:
    branches: [main]
  # Run after CI completes (for merges/rebases) to gate deploy path
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    # Run only when:
    # 1. It's a PR event (target main) OR
    # 2. A completed CI workflow_run on main concluded successfully
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        tool: [bandit, pip-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          enable-cache: false

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Setup environment and install dependencies
        run: |
          uv venv --allow-existing
          uv sync --dev --all-extras

      - name: Run security scan - ${{ matrix.tool }}
        run: |
          case "${{ matrix.tool }}" in
            bandit)
              echo "🔍 Running Bandit security scan..."
              .venv/bin/bandit -r backend frontend functions \
                --exclude "*/utest/*,*/test_*,*test*.py" \
                -f json -o bandit-report-bandit.json || true
              test -f bandit-report-bandit.json || echo '[]' > bandit-report-bandit.json
              .venv/bin/bandit -r backend frontend functions \
                --exclude "*/utest/*,*/test_*,*test*.py" \
                -q
              ;;
            pip-audit)
              echo "🔍 Running pip-audit dependency scan..."
              .venv/bin/pip-audit --desc -f json -o pip-audit-report-pip-audit.json || true
              test -f pip-audit-report-pip-audit.json || echo '[]' > pip-audit-report-pip-audit.json
              .venv/bin/pip-audit --desc
              ;;

          esac

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report-${{ matrix.tool }}
          path: '*-report-${{ matrix.tool }}.json'
          retention-days: 30
