name: CI

# This workflow runs code quality checks (lint, format, type-check, tests)
# Security checks in security.yaml depend on this workflow's success

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Change Detection - Skip E2E for docs-only changes
  # ─────────────────────────────────────────────────────────────────────────────
  detect-e2e-changes:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    outputs:
      should-run-e2e: ${{ steps.changes.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for E2E-relevant changes
        id: changes
        run: |
          # Always run on workflow_dispatch or push to main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Running E2E tests (event: $GITHUB_EVENT_NAME)"
            exit 0
          fi

          # For PRs, check if relevant files changed
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1 || true
            BASE_REF="origin/$GITHUB_BASE_REF"
          else
            git fetch origin main --depth=1 || true
            BASE_REF="origin/main"
          fi

          # Patterns that require E2E tests (includes workflow changes)
          E2E_PATTERNS="^(backend|frontend|functions|e2e|\.github/workflows)/|^compose\.yaml$|^pyproject\.toml$|^uv\.lock$"

          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E "$E2E_PATTERNS" -q; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "✅ E2E-relevant changes detected"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ No E2E-relevant changes - skipping E2E tests"
          fi

  lint:
    name: Lint, format, and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          enable-cache: false

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync deps (pyproject-first)
        run: |
          uv venv --allow-existing
          uv sync --dev --all-extras

      - name: Dependency declaration sanity check
        run: |
          bash scripts/check-deps.sh || true

      - name: Ruff lint
        run: .venv/bin/ruff check --output-format=github .

      - name: Ruff format (check only)
        run: .venv/bin/ruff format --check .

      - name: Ty type check
        env:
          PYTHONPATH: backend/src:frontend/src:functions/src
        run: .venv/bin/ty check .

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          fail_level: error

  tests:
    name: Tests (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            workdir: ./backend/src
            root: backend
          - name: frontend
            workdir: ./frontend/src
            root: frontend
          - name: functions
            workdir: ./functions/src
            root: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          enable-cache: false

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run tests (PR-aware)
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: |
          # On PRs, run tests only if changes under the project root; on pushes, always run
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ROOT="${{ matrix.root }}"
            echo "Checking for changes under $ROOT/"
            # Ensure base ref is available
            if [ -n "$GITHUB_BASE_REF" ]; then
              git fetch origin "$GITHUB_BASE_REF" --depth=1 || true
              BASE_REF="origin/$GITHUB_BASE_REF"
            else
              git fetch origin main --depth=1 || true
              BASE_REF="origin/main"
            fi
            if ! git diff --name-only "$BASE_REF"...HEAD | grep -E "^$ROOT/" -q; then
              echo "No changes under $ROOT/. Skipping ${{ matrix.name }} tests."
              exit 0
            fi
          fi
          # Prepare venv and deps from repo root
          cd ../..
          uv venv --allow-existing
          uv sync --dev --all-extras
          # Basic dependency check without container inspection
          SKIP_CONTAINER_CHECK=1 bash scripts/check-deps.sh || true
          cd - >/dev/null
          # Run tests
          ../../.venv/bin/python -m pytest -v

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Tests - Combined mock and integration tests in single job for efficiency
  # NOTE: This job intentionally doesn't use e2e-manual.yaml reusable workflow
  # because it runs TWO phases (mock + integration) in a single job to avoid
  # rebuilding Docker images twice. The reusable workflow is for single-suite runs.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    needs: [lint, tests, detect-e2e-changes]
    if: needs.detect-e2e-changes.outputs.should-run-e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json


      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: pnpm exec playwright install chromium --with-deps

      # Phase 1: Mock tests with fixture data
      - name: Start mock services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: MOCK_ESPN=true docker compose up -d --build --wait

      - name: Run mock E2E tests
        working-directory: ./e2e
        env:
          SERVICE_URL: http://localhost:5000
          BACKEND_URL: http://localhost:8000
          MOCK_ESPN: 'true'
        run: pnpm run test --project=chromium --project=api

      - name: Stop mock services
        run: docker compose down

      # Phase 2: Integration tests with live services
      - name: Start live services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose up -d --build --wait

      - name: Run integration E2E tests
        working-directory: ./e2e
        env:
          SERVICE_URL: http://localhost:5000
          BACKEND_URL: http://localhost:8000
        run: pnpm run test:ci

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down

  # Summary job for other workflows to depend on
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint, tests, e2e, detect-e2e-changes]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          LINT="${{ needs.lint.result }}"
          TESTS="${{ needs.tests.result }}"
          E2E="${{ needs.e2e.result }}"
          E2E_SHOULD_RUN="${{ needs.detect-e2e-changes.outputs.should-run-e2e }}"

          echo "Results: lint=$LINT, tests=$TESTS, e2e=$E2E, e2e_should_run=$E2E_SHOULD_RUN"

          # Lint and tests must pass
          if [ "$LINT" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "❌ CI pipeline failed (lint or tests)"
            exit 1
          fi

          # E2E must pass if it was supposed to run, or be skipped if not
          if [ "$E2E_SHOULD_RUN" = "true" ] && [ "$E2E" != "success" ]; then
            echo "❌ CI pipeline failed (e2e)"
            exit 1
          fi

          if [ "$E2E_SHOULD_RUN" = "false" ]; then
            echo "✅ CI pipeline completed (E2E skipped - no relevant changes)"
          else
            echo "✅ CI pipeline completed successfully"
          fi
