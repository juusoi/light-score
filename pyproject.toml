[project]
name = "light-score"
version = "0.1.0"
description = "NFL Scores and Standings app (Flask + FastAPI + AWS)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
backend = [
    "fastapi>=0.138.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]
frontend = [
    "flask>=3.1.3",
    "werkzeug>=3.1.6",
    "gunicorn>=23.0.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
functions = [
    "beautifulsoup4==4.15.0",
    "lxml>=6.1.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
]
security = ["bandit[toml]==1.9.4", "pip-audit==2.10.1"]

[tool.bandit]
exclude_dirs = ["*/utest/*", "*/test/*", "*/__pycache__/*"]
skips = ["B101"]

[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pygments>=2.20.0",
    "ruff>=0.6.4",
    "ty>=0.0.1a18",
    "types-requests>=2.32.0.0",
]
